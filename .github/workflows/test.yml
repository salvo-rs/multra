name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  build_and_test:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.94.0"
          - stable

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: ${{ matrix.toolchain }}

    - name: check
      run: cargo check --all --bins --examples --all-features

    - name: tests
      run: cargo test --all --all-features

  check_fuzz_target:
    name: Check fuzz target
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install stable
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: stable

    - name: check fuzz target
      run: cargo check --manifest-path fuzz/Cargo.toml

  check_fmt_and_docs:
    name: Checking fmt, clippy, and docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install stable with components
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: stable
        components: clippy,rustfmt

    - name: clippy
      run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery

    - name: fmt
      run: cargo fmt --all -- --check

    - name: Docs
      run: cargo doc --all-features --no-deps
