name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  audit_dependencies:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install stable
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --version 0.22.0 --locked

    - name: Audit library, examples, and fuzz dependencies
      run: |
        cargo generate-lockfile
        cargo audit --deny warnings
        cargo generate-lockfile --manifest-path fuzz/Cargo.toml
        cargo audit --file fuzz/Cargo.lock --deny warnings

  build_and_test:
    name: Build and test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.95.0"
          - stable

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: ${{ matrix.toolchain }}

    - name: check
      run: cargo check --all --bins --examples --all-features

    - name: tests (no default features)
      run: cargo test --all --no-default-features

    - name: tests (all features)
      run: cargo test --all --all-features

  check_fuzz_target:
    name: Check fuzz target
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install stable
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: stable

    - name: check fuzz target
      run: cargo check --manifest-path fuzz/Cargo.toml

  check_fmt_and_docs:
    name: Checking fmt, clippy, and docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install stable with components
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: stable
        components: clippy,rustfmt

    - name: clippy
      run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery

    - name: fmt
      run: cargo fmt --all -- --check

    - name: Docs
      run: cargo doc --all-features --no-deps

  fuzz_smoke:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install nightly
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        toolchain: nightly

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked

    - name: Build fuzz target
      run: cargo fuzz build fuzz_multipart_bytes

    - name: Run corpus and bounded mutations
      timeout-minutes: 2
      run: cargo fuzz run fuzz_multipart_bytes fuzz/corpus/fuzz_multipart_bytes -- -max_total_time=60 -timeout=5 -max_len=16384
