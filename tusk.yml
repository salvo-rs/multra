options:
  version:
    usage: The next release version
    short: v
    required: true
tasks:
  setup:
    run:
      - command: cargo install cargo-watch
      - command: cargo install releez
  check:dev:
    run:
      - command: cargo watch --watch ./src -x 'check --all-features'
  doc:dev:
    run:
      - command: cargo doc --open --all-features
      - command: cargo watch -x 'doc --all-features'
  test:dev:
    run:
      - command: cargo watch -x 'test --all-features'
  release:
    run:
      - command: releez "${version}"
